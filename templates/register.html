<!-- templates/register.html -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Register - Topnexor AI
</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:340px;
background:#111827;
padding:25px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

h1{
text-align:center;
color:#38bdf8;
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
outline:none;
font-size:15px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#38bdf8;
color:white;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.9;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#38bdf8;
text-decoration:none;
}

.info{
margin-top:15px;
text-align:center;
font-size:14px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="box">

<h1>
Create Account
</h1>

<input
type="text"
id="name"
placeholder="Enter Name"
>

<input
type="text"
id="phone"
placeholder="Enter Phone Number"
>

<input
type="password"
id="password"
placeholder="Create Password"
>

<select id="language">

<option value="">
Select Language
</option>

<option>
English
</option>

<option>
Hindi
</option>

<option>
Hinglish
</option>

</select>

<button onclick="register()">
Register
</button>

<p>

Already have account?

<a href="/">
Login
</a>

</p>

<div class="info">

Topnexor AI Secure Registration

</div>

</div>

<script>

async function register(){

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let password =
document.getElementById("password").value;

let language =
document.getElementById("language").value;

/* VALIDATION */

if(
name=="" ||
phone=="" ||
password=="" ||
language==""
){

alert("Please Fill All Fields");

return;

}

if(phone.length < 10){

alert("Enter Valid Phone Number");

return;

}

try{

let response = await fetch(

"http://127.0.0.1:5000/register",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:name,

phone:phone,

password:password,

language:language

})

}

);

let result =
await response.json();

alert(result.message);

if(result.success){

/* SAVE USER DATA */

localStorage.setItem(
"name",
name
);

localStorage.setItem(
"phone",
phone
);

localStorage.setItem(
"language",
language
);

/* GO TO LOGIN PAGE */

window.location.href="/";

}

}catch{

alert("⚠ Server Error");

}

}

</script>

</body>

</html>
